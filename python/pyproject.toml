# Окружение лабораторной. Платформа проверяет решение в образе с теми же
# версиями (checker-python-ml), так что `uv run pytest` у вас == проверка.
#   uv sync                 # установить окружение (.venv)
#   uv run jupyter lab      # открыть ноутбуки
#   uv run pytest           # прогнать тесты
[project]
name = "dlcv-assignment1"
version = "1"
requires-python = "==3.13.*"
dependencies = [
    "numpy>=2.3,<3",
    "scipy>=1.16,<2",
    "matplotlib>=3.10,<4",
    "pytest>=8.4,<9",
    "pytest-timeout>=2.4,<3",
]

[dependency-groups]
dev = ["jupyterlab>=4.4,<5"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 10
